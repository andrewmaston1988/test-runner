name: Tests

on:
  pull_request:
  push:
    branches: [master]

# The tests only read the repository; nothing in CI needs to write to it.
permissions:
  contents: read

# The package runs its own tests through itself, on both hosts it supports.
# A plain run on Windows also runs the *.win.test.mjs files; Linux skips them.
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The tests build throwaway git repositories and commit into them.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run tests
        run: node bin/test-runner.mjs --all
      - name: Orphan test files
        run: node bin/test-runner.mjs --orphans
